# ============================================================================
# pre-commit — hooks locais obrigatórios (HEL-M04, SEC-011)
# Instale com: pip install pre-commit && pre-commit install
# O hook gitleaks bloqueia commit com segredo (e roda a varredura no diff).
# ============================================================================
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
