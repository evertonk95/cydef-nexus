# ============================================================================
# Gitleaks — varredura do histórico git completo (HEL-M04)
# Semanal (segunda 03:00 UTC) + manual (workflow_dispatch) + recomendado antes
# de cada release público. Qualquer achado = incidente (rotação + comunicação;
# purga de histórico somente com aprovação explícita de Everton).
# gitleaks pinado por versão (v8.30.1) — binário baixado do release oficial.
# ============================================================================

name: Gitleaks — full history scan

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  history-scan:
    name: Varredura do histórico completo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (clone completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Baixar gitleaks v8.30.1 (pinned)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Varredura do histórico completo
        run: gitleaks git --redact --exit-code=1 --config=.gitleaks.toml
