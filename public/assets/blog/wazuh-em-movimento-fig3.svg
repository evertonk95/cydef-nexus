<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="A cadeia que transforma coleta técnica em melhoria controlada: coleta, evidência, gap register, priorização, ação com rollback e validação por KPI.">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0f"/>
      <stop offset="1" stop-color="#141216"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg3)"/>
  <text x="60" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#f5f5f5">Da evidência à melhoria controlada</text>
  <text x="60" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9ca3af">Prints e outputs são matéria-prima — o produto é um plano que liga evidência a risco, ação e validação.</text>

  <!-- Etapas -->
  <g transform="translate(60,140)">
    <rect width="170" height="86" rx="12" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
    <text x="85" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Coleta</text>
    <text x="85" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9ca3af">estado + contadores</text>
    <text x="85" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9ca3af">+ séries temporais</text>
  </g>
  <g transform="translate(250,172)">
    <path d="M0,4 L22,4" stroke="#f97316" stroke-width="2"/>
    <path d="M18,0 L22,4 L18,8" fill="none" stroke="#f97316" stroke-width="2"/>
  </g>
  <g transform="translate(290,140)">
    <rect width="170" height="86" rx="12" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
    <text x="85" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Gap register</text>
    <text x="85" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9ca3af">achado + evidência</text>
    <text x="85" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9ca3af">+ causa + impacto</text>
  </g>
  <g transform="translate(480,172)">
    <path d="M0,4 L22,4" stroke="#f97316" stroke-width="2"/>
    <path d="M18,0 L22,4 L18,8" fill="none" stroke="#f97316" stroke-width="2"/>
  </g>
  <g transform="translate(520,140)">
    <rect width="170" height="86" rx="12" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
    <text x="85" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Prioridade</text>
    <text x="85" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9ca3af">P0 contenção</text>
    <text x="85" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9ca3af">P1 estabilização…</text>
  </g>
  <g transform="translate(710,172)">
    <path d="M0,4 L22,4" stroke="#f97316" stroke-width="2"/>
    <path d="M18,0 L22,4 L18,8" fill="none" stroke="#f97316" stroke-width="2"/>
  </g>
  <g transform="translate(750,140)">
    <rect width="170" height="86" rx="12" fill="#7c2d12" stroke="#fb923c" stroke-width="1.5"/>
    <text x="85" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Mudança</text>
    <text x="85" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fed7aa">com rollback</text>
    <text x="85" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fed7aa">e GMUD quando cabível</text>
  </g>
  <g transform="translate(940,172)">
    <path d="M0,4 L22,4" stroke="#f97316" stroke-width="2"/>
    <path d="M18,0 L22,4 L18,8" fill="none" stroke="#f97316" stroke-width="2"/>
  </g>
  <g transform="translate(980,140)">
    <rect width="160" height="86" rx="12" fill="#7c2d12" stroke="#fb923c" stroke-width="1.5"/>
    <text x="80" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Validação</text>
    <text x="80" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fed7aa">critério de aceite</text>
    <text x="80" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fed7aa">+ KPI pós-mudança</text>
  </g>

  <!-- Loop -->
  <g transform="translate(520,300)">
    <rect width="160" height="60" rx="12" fill="#292524" stroke="#a1a1aa" stroke-width="1.2"/>
    <text x="80" y="27" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#e4e4e7">Maturidade</text>
    <text x="80" y="47" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a1a1aa">reassessment contínuo</text>
  </g>
  <path d="M1060,183 C1120,183 1120,330 680,330" fill="none" stroke="#52525b" stroke-width="1.6" stroke-dasharray="6 5"/>
  <path d="M680,324 L680,336 M680,336 L676,328" stroke="#52525b" stroke-width="1.6" fill="none"/>
  <text x="1065" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">retorno ao gap register / waves</text>
</svg>
