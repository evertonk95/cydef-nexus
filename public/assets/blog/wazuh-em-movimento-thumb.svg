<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Wazuh em Movimento: como avaliar, estabilizar e amadurecer um SIEM que já está em produção">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0d"/>
      <stop offset="0.55" stop-color="#141218"/>
      <stop offset="1" stop-color="#1c1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <!-- grade sutil -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/><line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/><line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>
  <!-- badge -->
  <g transform="translate(70,64)">
    <rect width="236" height="40" rx="20" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-opacity="0.5"/>
    <text x="118" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fb923c">CYDEF · WAZUH</text>
  </g>
  <!-- titulo -->
  <text x="70" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">Wazuh em</text>
  <text x="70" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">Movimento</text>
  <!-- barra laranja -->
  <rect x="72" y="440" width="150" height="6" rx="3" fill="url(#bar)"/>
  <!-- subtitulo -->
  <text x="70" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#d4d4d8">Como avaliar, estabilizar e amadurecer um SIEM</text>
  <text x="70" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#d4d4d8">que já está em produção</text>
  <!-- autor -->
  <text x="70" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#a1a1aa">Everton Nascimento · Cybersecurity | SOC | Incident Response | Wazuh</text>
  <!-- rodape -->
  <rect x="0" y="655" width="1200" height="20" fill="#f97316" fill-opacity="0.9"/>
  <text x="1200" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="1" fill="#000000">.</text>
</svg>
